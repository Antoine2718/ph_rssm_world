[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ph-rssm-world-model"
version = "0.1.0"
description = "Port-Hamiltonian and Lagrangian Neural World Models coupled with Recurrent State-Space Models (PH-RSSM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antoine & Research Collaborator" }
]
keywords = [
    "world-models",
    "port-hamiltonian",
    "lagrangian-neural-networks",
    "symplectic-integrators",
    "rssm",
    "geometric-deep-learning"
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
